# Contributor License Agreement check.
#
# Comments on any pull request whose author has not yet agreed to CLA.md, and
# blocks the merge until they reply with the sentence below. Agreements are
# recorded in a separate private repository, one row per contributor with the
# commit SHA and timestamp, which is the evidence trail an audit needs.
#
# SETUP REQUIRED BEFORE THIS DOES ANYTHING:
#   1. Create a private repo to hold signatures, e.g. Qventu/cla-signatures,
#      with an empty `signatures/version1/cla.json` containing `{}`.
#   2. Create a Personal Access Token with `repo` scope on an account that can
#      write to it, and add it to this repository as the secret
#      PERSONAL_ACCESS_TOKEN.
#   3. Update `remote-repository-name` below if you chose a different name.
#
# Until those exist the workflow will fail on external pull requests. Remove the
# file, or leave it disabled, if you would rather track agreement by hand.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Check or record CLA agreement
        if: >
          (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
          || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/Qventu/exulu-frontend/blob/main/CLA.md'
          branch: 'main'
          allowlist: dclaessen-exulu,bot*,dependabot[bot],semantic-release-bot

          # Signatures live outside this public repository so contributor
          # email addresses are not published.
          remote-organization-name: Qventu
          remote-repository-name: cla-signatures

          custom-notsigned-prcomment: >
            Thanks for the pull request. Before we can merge it, please read the
            [Contributor License Agreement](https://github.com/Qventu/exulu-frontend/blob/main/CLA.md)
            and agree to it by posting exactly this comment:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have agreed to the CLA.'

      # The action above resolves contributors from COMMIT authors. When those
      # resolve to the allowlist (or to nothing, for unlinked emails) it reports
      # "all signed" and therefore RECORDS NOTHING — so a contributor posting the
      # sign phrase was never written to the signatures file and could never go
      # green. This step is self-sufficient: it records the agreement itself.
      #
      # always(): the action also crashes outright on pull requests whose commits
      # have no resolvable login, which would otherwise skip this step.
      #
      # Two tokens on purpose: PERSONAL_ACCESS_TOKEN is fine-grained and scoped
      # to the private signatures repo, so it cannot comment here; GITHUB_TOKEN
      # can comment but cannot read or write that repo.
      - name: Require the pull request author to have agreed
        if: >
          always() && (
            github.event_name == 'pull_request_target'
            || (github.event_name == 'issue_comment' && github.event.issue.pull_request)
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIG_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          AUTHOR: ${{ github.event.pull_request.user.login || github.event.issue.user.login }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          COMMENTER: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          CLA_URL: https://github.com/Qventu/exulu-frontend/blob/main/CLA.md
          ALLOWLIST: 'dclaessen-exulu,dependabot[bot],semantic-release-bot'
        run: |
          set -euo pipefail
          SIG_PATH=repos/Qventu/cla-signatures/contents/signatures/version1/cla.json
          SIGN_PHRASE='I have read the CLA Document and I hereby sign the CLA'

          if printf '%s' "$ALLOWLIST" | tr ',' '\n' | grep -Fxq "$AUTHOR"; then
            echo "::notice::$AUTHOR is on the allowlist; no agreement required."
            exit 0
          fi

          read_signed() {
            GH_TOKEN="$SIG_TOKEN" gh api "$SIG_PATH" --jq '.content' | base64 -d \
              | jq -r '[.signedContributors[]?.name] | join("\n")'
          }

          # Record an agreement when someone posts the sign phrase on this PR.
          if [ "$EVENT" = "issue_comment" ]; then
            trimmed=$(printf '%s' "${COMMENT_BODY:-}" | tr -d '\r' \
                      | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ "$trimmed" = "$SIGN_PHRASE" ]; then
              if read_signed | grep -Fxq "$COMMENTER"; then
                echo "::notice::$COMMENTER had already agreed."
              else
                tmp=$(mktemp -d)
                GH_TOKEN="$SIG_TOKEN" gh api "$SIG_PATH" > "$tmp/resp.json"
                sha=$(jq -r .sha "$tmp/resp.json")
                jq -r .content "$tmp/resp.json" | base64 -d > "$tmp/cur.json"
                jq --arg n "$COMMENTER" \
                   --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                   --arg r "$REPO" --argjson p "$PR" \
                   '.signedContributors = ((.signedContributors // []) + [{name:$n, created_at:$d, repo:$r, pullRequestNo:$p}])' \
                   "$tmp/cur.json" > "$tmp/new.json"
                GH_TOKEN="$SIG_TOKEN" gh api -X PUT "$SIG_PATH" \
                  -f message="CLA agreed by $COMMENTER ($REPO#$PR)" \
                  -f content="$(base64 -w0 < "$tmp/new.json")" \
                  -f sha="$sha" -f branch=main > /dev/null
                echo "::notice::Recorded CLA agreement for $COMMENTER."
              fi
            fi
          fi

          if read_signed | grep -Fxq "$AUTHOR"; then
            echo "::notice::$AUTHOR has agreed to the CLA."
            exit 0
          fi

          marker='<!-- exulu-cla-author-check -->'
          posted=$(gh pr view "$PR" --repo "$REPO" --json comments \
                     --jq '[.comments[].body] | join("\n")' | grep -Fc "$marker" || true)

          if [ "$posted" = "0" ]; then
            {
              printf '%s\n\n' "$marker"
              printf 'Thanks for the pull request, @%s.\n\n' "$AUTHOR"
              printf 'Before it can be merged you need to agree to the [Contributor License Agreement](%s). ' "$CLA_URL"
              printf 'You keep ownership of your contribution; the agreement gives Qventu the rights it needs to distribute and license it.\n\n'
              printf '**To agree, post this as a comment on this pull request, exactly as written:**\n\n'
              printf '```\n%s\n```\n\n' "$SIGN_PHRASE"
              printf 'The check then re-runs and turns green. You only need to do this once.\n\n'
              printf -- '---\n\n'
              printf 'Separately: your commits are authored under an email address that is not linked to your GitHub account, '
              printf 'so they show as unattributed. Adding it under [Settings → Emails](https://github.com/settings/emails) fixes that.\n'
            } > /tmp/cla-comment.md
            gh pr comment "$PR" --repo "$REPO" --body-file /tmp/cla-comment.md
            echo "::notice::Posted CLA instructions for $AUTHOR."
          fi

          echo "::error::The pull request author ($AUTHOR) has not agreed to the Contributor License Agreement. See the comment on this pull request for how to do it."
          exit 1
